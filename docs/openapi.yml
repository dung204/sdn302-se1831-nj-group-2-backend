openapi: 3.0.3
info:
  title: Internet Cafe Management System API
  version: '1.0'
  description: |-
    This is the API documentation for the Internet Cafe Management System. It is an assignment project for the SDN302 - Server-side Development with Node.js, Express & MongoDB course at FPT University

    Members of Group 2:
    - Hồ Anh Dũng - HE181529 (Leader)
    - Hoàng Gia Trọng - HE172557 
    - Vũ Lương Bảo - HE172612 
    - Nguyễn Ngọc Anh - HE176642 
    - Nguyễn Hữu Tâm - HE187049 

    The source code is available here: [https://github.com/dung204/sdn302-se1831-nj-group-2-backend](https://github.com/dung204/sdn302-se1831-nj-group-2-backend)
  contact:
    name: Hồ Anh Dũng - HE181529 - The leader of Group 2
    email: dunghahe185129@fpt.edu.vn
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
tags:
  - name: auth
    description: Authentication & Authorization
  - name: users
    description: User management
servers:
  - url: http://localhost:9999
    description: Development server
paths:
  /api/v1/auth/login:
    post:
      summary: Login to the system
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '201':
          description: Login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginSuccessDto'
        '400':
          description: Username or password is missing/invalid
        '401':
          description: Username or password is incorrect
  /api/v1/auth/refresh-token:
    post:
      summary: Refresh the access token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImpvaG4uZG9lIiwicm9sZSI6IkFETUlOIiwiaWF0IjoxNTE2MjM5MDIyfQ.4k7
      responses:
        '201':
          description: Refresh token successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefreshSuccessDto'
        '400':
          description: Refresh token is missing/invalid
        '401':
          description: Refresh token is incorrect
  /api/v1/auth/logout:
    delete:
      summary: Logout from the system
      tags:
        - auth
      responses:
        '204':
          description: Logout successfully
        '401':
          description: User has not logged in yet
      security:
        - JWT: []
  /api/v1/auth/change-password:
    patch:
      summary: Change the password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: password
                newPassword:
                  type: string
                  example: newpassword
      responses:
        '204':
          description: Change password successfully
        '400':
          description: Old password or new password is missing/incorrect
      security:
        - JWT: []
  /api/v1/users:
    get:
      summary: Get all users
      description:
        Allowed sorting fields are `createTimestamp`, `id`, `firstName`,
        `lastName`, `deleteTimestamp`
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all users information successfully (with pagination metadata).
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserDto'
                  - $ref: '#/components/schemas/ResponseMeta'
      security:
        - JWT: []
    post:
      summary: Create a new user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '400':
          description: Bad request
        '409':
          description: Username already exists
      security:
        - JWT: []
  /api/v1/users/{id}:
    get:
      summary: Get a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get a user information successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
      security:
        - JWT: []
    patch:
      summary: Update a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '400':
          description: Bad request
        '404':
          description: User not found
      security:
        - JWT: []
    delete:
      summary: Delete a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
      security:
        - JWT: []
  /api/v1/users/deleted:
    get:
      summary: Get all deleted users
      description:
        Allowed sorting fields are `createTimestamp`, `id`, `firstName`,
        `lastName`, `deleteTimestamp`
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description:
            Get all deleted users information successfully (with pagination
            metadata).
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeletedUserDto'
                  - $ref: '#/components/schemas/ResponseMeta'
      security:
        - JWT: []
  /api/v1/users/restore/{id}:
    patch:
      summary: Restore a deleted user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
      security:
        - JWT: []
  /api/v1/usage-tracking:
    get:
      summary: Get all usage tracking records
      tags:
        - usage-tracking
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description:
            Get all usage tracking records successfully (with pagination
            metadata)
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UsageTrackingDto'
                  - $ref: '#/components/schemas/ResponseMeta'
      security:
        - JWT: []
    post:
      summary: Create a new usage tracking record
      tags:
        - usage-tracking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUsageTrackingDto'
      responses:
        '201':
          description: Usage tracking record created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsageTrackingDto'
        '400':
          description: Bad request
      security:
        - JWT: []
  /api/v1/usage-tracking/{id}:
    get:
      summary: Get a usage tracking record by ID
      tags:
        - usage-tracking
      parameters:
        - name: id
          in: path
          description: The usage tracking record ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get usage tracking record successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsageTrackingDto'
        '404':
          description: Usage tracking record not found
      security:
        - JWT: []
    patch:
      summary: Update a usage tracking record by ID
      tags:
        - usage-tracking
      parameters:
        - name: id
          in: path
          description: The usage tracking record ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUsageTrackingDto'
      responses:
        '200':
          description: Usage tracking record updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsageTrackingDto'
        '400':
          description: Bad request
        '404':
          description: Usage tracking record not found
      security:
        - JWT: []
    delete:
      summary: Delete a usage tracking record by ID
      tags:
        - usage-tracking
      parameters:
        - name: id
          in: path
          description: The usage tracking record ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Usage tracking record deleted successfully
        '404':
          description: Usage tracking record not found
      security:
        - JWT: []
  /api/v1/usage-tracking/deleted:
    get:
      summary: Get all deleted usage tracking records
      tags:
        - usage-tracking
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all deleted usage tracking records successfully (with
            pagination metadata)
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeletedUsageTrackingDto'
                  - $ref: '#/components/schemas/ResponseMeta'
      security:
        - JWT: []
  /api/v1/usage-tracking/restore/{id}:
    patch:
      summary: Restore a deleted usage tracking record
      tags:
        - usage-tracking
      parameters:
        - name: id
          in: path
          description: The usage tracking record ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usage tracking record restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsageTrackingDto'
        '404':
          description: Usage tracking record not found
      security:
        - JWT: []
components:
  schemas:
    LoginRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john.doe
        password:
          type: string
          example: password
    LoginSuccessDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        role:
          $ref: '#/components/schemas/Role'
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJlYzczOWJkNi02ZGNlLTQzYWYtOTFkYi1iNzg2YmQwMWVkNzkiLCJyb2xlIjoiQURNSU4iLCJpYXQiOjE3NDA1MDI3NDEsImV4cCI6MTc0MDUwNjM0MX0.Mgl-FANwtPMGhO3_HeOeoBFn2PoEYfSYsC4ECFgl0TE
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJlYzczOWJkNi02ZGNlLTQzYWYtOTFkYi1iNzg2YmQwMWVkNzkiLCJpYXQiOjE3NDA1MDI3NDEsImV4cCI6MTc0MzA5NDc0MX0.GWRNcc0jLR9KN97nH36W6gFqDRAV4PNycD_w8jcezXg
    RefreshSuccessDto:
      allOf:
        - $ref: '#/components/schemas/LoginSuccessDto'
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        username:
          type: string
          example: john.doe
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        address:
          type: string
          example: 123 Main St
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        citizenNumber:
          type: string
          nullable: true
          example: '123456789'
        phoneNumber:
          type: string
          nullable: true
          example: '+84123456789'
        availableTime:
          type: number
          nullable: true
          example: 3600
        createTimestamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
    DeletedUserDto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            deleteTimestamp:
              type: string
              format: date-time
              example: 2021-01-01T00:00:00Z
    UpdateUserDto:
      type: object
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        address:
          type: string
          example: 123 Main St
        role:
          $ref: '#/components/schemas/Role'
        citizenNumber:
          type: string
          example: '123456789'
        phoneNumber:
          type: string
          example: '+84123456789'
        availableTime:
          type: number
          example: 3600
    CreateUserDto:
      required:
        - username
        - password
        - firstName
        - lastName
      allOf:
        - type: object
          properties:
            username:
              type: string
              example: john.doe
            password:
              type: string
              example: password
        - $ref: '#/components/schemas/UpdateUserDto'
    UsageTrackingDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        user:
          type: string
          description: User ID reference
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        computer:
          type: string
          description: Computer ID reference
          example: bb3269d8-6ede-588c-9707-8f97bd01ed45
        startTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
        endTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T02:00:00Z
        createTimestamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
    CreateUsageTrackingDto:
      type: object
      required:
        - user
        - computer
        - startTimeStamp
        - endTimeStamp
      properties:
        user:
          type: string
          format: uuid
          description: User ID reference
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        computer:
          type: string
          format: uuid
          description: Computer ID reference
          example: bb3269d8-6ede-588c-9707-8f97bd01ed45
        startTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
        endTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T02:00:00Z
    UpdateUsageTrackingDto:
      type: object
      properties:
        user:
          type: string
          format: uuid
          description: User ID reference
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        computer:
          type: string
          format: uuid
          description: Computer ID reference
          example: bb3269d8-6ede-588c-9707-8f97bd01ed45
        startTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
        endTimeStamp:
          type: string
          format: date-time
          example: 2021-01-01T02:00:00Z
    UsageTrackingQueryDto:
      allOf:
        - type: object
          properties:
            sorting:
              type: array
              items:
                type: string
                enum:
                  - id
                  - user
                  - computer
                  - startTimeStamp
                  - endTimeStamp
                  - createTimestamp
                  - deleteTimestamp
                example: createTimestamp:desc
        - $ref: '#/components/schemas/ResponseMeta'
    DeletedUsageTrackingDto:
      allOf:
        - $ref: '#/components/schemas/UsageTrackingDto'
        - type: object
          properties:
            deleteTimestamp:
              type: string
              format: date-time
              example: 2021-01-01T00:00:00Z
    Role:
      type: string
      enum:
        - ADMIN
        - STAFF
        - GUEST
        - OWNER
    ResponseMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                  description: The current page number
                pageSize:
                  type: integer
                  example: 10
                  description: The number of items per page
                total:
                  type: integer
                  example: 100
                  description: The total number of items (without pagination)
                totalPage:
                  type: integer
                  example: 10
                  description: The total number of pages
                hasPreviousPage:
                  type: boolean
                  example: false
                  description: Whether there is a previous page
                hasNextPage:
                  type: boolean
                  example: true
                  description: Whether there is a next page
            sorting:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: createTimestamp
                    description: The field to sort
                  direction:
                    type: string
                    example: desc
                    description: The order to sort
  parameters:
    page:
      name: page
      in: query
      description: The current page number
      required: false
      schema:
        type: integer
        default: 1
    pageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        default: 10
    sorting:
      name: sorting
      in: query
      description: The sorting for the query. The syntax is `{field}:{order}`,
      required: false
      schema:
        type: array
        items:
          type: string
          default: createTimestamp:desc
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
