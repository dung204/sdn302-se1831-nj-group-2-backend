openapi: 3.0.3
info:
  title: Internet Cafe Management System API
  version: '1.0'
  description: |-
    This is the API documentation for the Internet Cafe Management System. It is an assignment project for the SDN302 - Server-side Development with Node.js, Express & MongoDB course at FPT University

    Members of Group 2:
    - Hồ Anh Dũng - HE181529 (Leader)
    - Hoàng Gia Trọng - HE172557 
    - Vũ Lương Bảo - HE172612 
    - Nguyễn Ngọc Anh - HE176642 
    - Nguyễn Hữu Tâm - HE187049

    The source code is available here: [https://github.com/dung204/sdn302-se1831-nj-group-2-backend](https://github.com/dung204/sdn302-se1831-nj-group-2-backend)
  contact:
    name: Hồ Anh Dũng - HE181529 - The leader of Group 2
    email: dunghahe185129@fpt.edu.vn
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
tags:
  - name: auth
    description: Authentication & Authorization
  - name: users
    description: User management
  - name: service-categories
    description: Service categories management
  - name: services
    description: Services management
paths:
  /api/v1/auth/login:
    post:
      summary: Login to the system
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '201':
          description: Login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginSuccessDto'
        '400':
          description: Username or password is missing/invalid
        '401':
          description: Username or password is incorrect
  /api/v1/auth/refresh-token:
    post:
      summary: Refresh the access token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImpvaG4uZG9lIiwicm9sZSI6IkFETUlOIiwiaWF0IjoxNTE2MjM5MDIyfQ.4k7
      responses:
        '201':
          description: Refresh token successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefreshSuccessDto'
        '400':
          description: Refresh token is missing/invalid
        '401':
          description: Refresh token is incorrect
  /api/v1/auth/logout:
    delete:
      summary: Logout from the system
      tags:
        - auth
      responses:
        '204':
          description: Logout successfully
        '401':
          description: User has not logged in yet
      security:
        - JWT: []
  /api/v1/auth/change-password:
    patch:
      summary: Change the password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: password
                newPassword:
                  type: string
                  example: newpassword
      responses:
        '204':
          description: Change password successfully
        '400':
          description: Old password or new password is missing/incorrect
      security:
        - JWT: []
  /api/v1/users:
    get:
      summary: Get all users
      description:
        Allowed sorting fields are `createTimestamp`, `id`, `firstName`,
        `lastName`, `deleteTimestamp`
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all users information successfully (with pagination metadata).
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserDto'
                  - $ref: '#/components/schemas/ResponseMeta'
    post:
      summary: Create a new user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '400':
          description: Bad request
        '409':
          description: Username already exists
  /api/v1/users/{id}:
    get:
      summary: Get a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get a user information successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found
    patch:
      summary: Update a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '400':
          description: Bad request
        '404':
          description: User not found
    delete:
      summary: Delete a user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
  /api/v1/users/deleted:
    get:
      summary: Get all deleted users
      description:
        Allowed sorting fields are `createTimestamp`, `id`, `firstName`,
        `lastName`, `deleteTimestamp`
      tags:
        - users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description:
            Get all deleted users information successfully (with pagination
            metadata).
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeletedUserDto'
                  - $ref: '#/components/schemas/ResponseMeta'
  /api/v1/users/restore/{id}:
    patch:
      summary: Restore a deleted user by ID
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: The user ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserDto'
        '404':
          description: User not found

  /api/v1/service-categories:
    get:
      summary: Get all service categories
      tags:
        - service-categories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all service categories successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceCategoryDto'
      security:
        - JWT: []
    post:
      summary: Create a new servicess
      tags:
        - service-categories
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateServiceCategoryDto'
      responses:
        '201':
          description: Service category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceCategoryDto'
        '400':
          description: Bad request
      security:
        - JWT: []
  /api/v1/service-categories/{id}:
    get:
      summary: Get a service category by ID
      tags:
        - service-categories
      parameters:
        - name: id
          in: path
          description: The service category ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get service category successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceCategoryDto'
        '404':
          description: Service category not found
      security:
        - JWT: []
    patch:
      summary: Update a service category by ID
      tags:
        - service-categories
      parameters:
        - name: id
          in: path
          description: The service category ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateServiceCategoryDto'
      responses:
        '200':
          description: Service category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceCategoryDto'
        '400':
          description: Bad request
        '404':
          description: Service category not found
      security:
        - JWT: []
    delete:
      summary: Soft delete a service category by ID
      tags:
        - service-categories
      parameters:
        - name: id
          in: path
          description: The service category ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Service category deleted successfully
        '404':
          description: Service category not found
      security:
        - JWT: []
  /api/v1/service-categories/deleted:
    get:
      summary: Get all deleted service categories
      tags:
        - service-categories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all deleted service categories successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceCategoryDto'
      security:
        - JWT: []
  /api/v1/service-categories/restore/{id}:
    patch:
      summary: Restore a deleted service category by ID
      tags:
        - service-categories
      parameters:
        - name: id
          in: path
          description: The service category ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Service category restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceCategoryDto'
        '404':
          description: Service category not found
      security:
        - JWT: []

  /api/v1/services:
    get:
      summary: Get all services
      tags:
        - services
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all services successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceDto'
      security:
        - JWT: []
    post:
      summary: Create a new services
      tags:
        - services
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateServiceDto'
      responses:
        '201':
          description: Services created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceDto'
        '400':
          description: Bad request
      security:
        - JWT: []
  /api/v1/services/{id}:
    get:
      summary: Get a services  by ID
      tags:
        - services
      parameters:
        - name: id
          in: path
          description: The services ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Get services successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceDto'
        '404':
          description: Services not found
      security:
        - JWT: []
    patch:
      summary: Update a services by ID
      tags:
        - services
      parameters:
        - name: id
          in: path
          description: The services ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateServiceDto'
      responses:
        '200':
          description: Services updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceDto'
        '400':
          description: Bad request
        '404':
          description: Services not found
      security:
        - JWT: []
    delete:
      summary: Soft delete a services by ID
      tags:
        - services
      parameters:
        - name: id
          in: path
          description: The services ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Services deleted successfully
        '404':
          description: Services not found
      security:
        - JWT: []
  /api/v1/services/deleted:
    get:
      summary: Get all deleted services
      tags:
        - services
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sorting'
      responses:
        '200':
          description: Get all deleted services successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeletedServiceDto'
      security:
        - JWT: []
  /api/v1/services/restore/{id}:
    patch:
      summary: Restore a deleted services by ID
      tags:
        - services
      parameters:
        - name: id
          in: path
          description: The services ID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Services restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceDto'
        '404':
          description: Services not found
      security:
        - JWT: []
components:
  schemas:
    LoginRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john.doe
        password:
          type: string
          example: password
    LoginSuccessDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        role:
          $ref: '#/components/schemas/Role'
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJlYzczOWJkNi02ZGNlLTQzYWYtOTFkYi1iNzg2YmQwMWVkNzkiLCJyb2xlIjoiQURNSU4iLCJpYXQiOjE3NDA1MDI3NDEsImV4cCI6MTc0MDUwNjM0MX0.Mgl-FANwtPMGhO3_HeOeoBFn2PoEYfSYsC4ECFgl0TE
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJlYzczOWJkNi02ZGNlLTQzYWYtOTFkYi1iNzg2YmQwMWVkNzkiLCJpYXQiOjE3NDA1MDI3NDEsImV4cCI6MTc0MzA5NDc0MX0.GWRNcc0jLR9KN97nH36W6gFqDRAV4PNycD_w8jcezXg
    RefreshSuccessDto:
      allOf:
        - $ref: '#/components/schemas/LoginSuccessDto'
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        address:
          type: string
          example: 123 Main St
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        createTimestamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
    DeletedUserDto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            deleteTimestamp:
              type: string
              format: date-time
              example: 2021-01-01T00:00:00Z
    UpdateUserDto:
      type: object
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        address:
          type: string
          example: 123 Main St
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
    CreateUserDto:
      required:
        - username
        - password
        - firstName
        - lastName
      allOf:
        - type: object
          properties:
            username:
              type: string
              example: john.doe
            password:
              type: string
              example: password
        - $ref: '#/components/schemas/UpdateUserDto'
    BranchDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: bb3158c7-5bd1-477b-8606-7e96ea09e456
        name:
          type: string
          example: Downtown Branch
        address:
          type: string
          example: 123 Main St, Downtown
          nullable: true
        admin:
          type: string
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
          description: ID of the admin user
        # services:
        #   type: array
        #   items:
        #     type: string
        #   example: ['Gaming', 'Printing', 'Internet']
        createTimestamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
    DeletedBranchDto:
      allOf:
        - $ref: '#/components/schemas/BranchDto'
        - type: object
          properties:
            deleteTimestamp:
              type: string
              format: date-time
              example: 2021-01-01T00:00:00Z
    CreateBranchDto:
      type: object
      required:
        - name
        - admin
      properties:
        name:
          type: string
          example: Downtown Branch
        address:
          type: string
          example: 123 Main St, Downtown
          nullable: true
        admin:
          type: string
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
          description: ID of the admin user
        services:
          type: array
          items:
            type: string
          example: ['Gaming', 'Printing', 'Internet']
    UpdateBranchDto:
      type: object
      properties:
        name:
          type: string
          example: Downtown Branch
        address:
          type: string
          example: 123 Main St, Downtown
          nullable: true
        admin:
          type: string
          example: aa2158c7-5bd1-477b-8606-7e96ea09e334
          description: ID of the admin user
        services:
          type: array
          items:
            type: string
          example: ['Gaming', 'Printing', 'Internet']
    Role:
      type: string
      enum:
        - OWNER
        - BRANCH_ADMIN
        - STAFF
        - GUEST
        - OWNER
    ServiceCategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d68b5c72-3d41-4d4a-8d1d-123456789abc
        name:
          type: string
          example: Gaming ServiceCategoryDto
        description:
          type: string
          example: ServiceCategoryDto related to gaming PCs and consoles
    CreateServiceCategoryDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Gaming ServiceCategoryDto
        description:
          type: string
          example: ServiceCategoryDto related to gaming PCs and consoles
    UpdateServiceCategoryDto:
      type: object
      properties:
        name:
          type: string
          example: Updated Gaming ServiceCategoryDto
        description:
          type: string
          example: Updated description of gaming ServiceCategoryDto
    ServiceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d68b5c72-3d41-4d4a-8d1d-123456789abc
        category:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCategoryDto'
        name:
          type: string
          example: Gaming Services
        description:
          type: string
          example: Services related to gaming PCs and consoles
        price:
          type: number
          example: 20000
        createTimestamp:
          type: string
          format: date-time
          example: 2021-01-01T00:00:00Z
    DeletedServiceDto:
      allOf:
        - $ref: '#/components/schemas/ServiceDto'
        - type: object
          properties:
            deleteTimestamp:
              type: string
              format: date-time
              example: 2021-01-01T00:00:00Z
    CreateServiceDto:
      type: object
      required:
        - name
        - price
        - categoryId
      properties:
        name:
          type: string
          example: Gaming Services
        description:
          type: string
          example: Services related to gaming PCs and consoles
        price:
          type: number
          example: 20000
        categoryId:
          type: string
          format: uuid
          example: 5f7e1d3b-9d21-4c3a-8f8b-123456789abc
    UpdateServiceDto:
      type: object
      properties:
        name:
          type: string
          example: Updated Gaming Services
        description:
          type: string
          example: Updated description of gaming services
        price:
          type: number
          example: 25000
        categoryId:
          type: string
          format: uuid
          example: 5f7e1d3b-9d21-4c3a-8f8b-123456789abc
    ResponseMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                  description: The current page number
                pageSize:
                  type: integer
                  example: 10
                  description: The number of items per page
                total:
                  type: integer
                  example: 100
                  description: The total number of items (without pagination)
                totalPage:
                  type: integer
                  example: 10
                  description: The total number of pages
                hasPreviousPage:
                  type: boolean
                  example: false
                  description: Whether there is a previous page
                hasNextPage:
                  type: boolean
                  example: true
                  description: Whether there is a next page
            sorting:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: createTimestamp
                    description: The field to sort
                  direction:
                    type: string
                    example: desc
                    description: The order to sort
  parameters:
    page:
      name: page
      in: query
      description: The current page number
      required: false
      schema:
        type: integer
        default: 1
    pageSize:
      name: pageSize
      in: query
      description: The number of items per page
      required: false
      schema:
        type: integer
        default: 10
    sorting:
      name: sorting
      in: query
      description: The sorting for the query. The syntax is `{field}:{order}`,
      required: false
      schema:
        type: array
        items:
          type: string
          default: createTimestamp:desc
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
